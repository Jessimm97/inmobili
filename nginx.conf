server {
    listen 80;
    
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Esta línea es la MAGIA: si no encuentra el archivo, carga index.html
        # Esto permite que React Router maneje la URL
        try_files $uri $uri/ /index.html;
    }

    # Opcional: Configuración para errores 50x
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}